name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - uses: taiki-e/install-action@1d92235f62ef9ca1b374840a5dfe9f918f4ef0c3 # cargo-deny
      - run: cargo deny check advisories licenses sources

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [getmeili/meilisearch:v1.12.8, getmeili/meilisearch:latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: docker run -d --rm --name meili -p 7700:7700 -e MEILI_MASTER_KEY=integration-master-key-123 '${{ matrix.image }}'
      - run: for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7700/health && exit 0; sleep 1; done; exit 1
      - run: cargo test live_instance_workflow -- --ignored
        env:
          MEILI_TEST_URL: http://127.0.0.1:7700
          MEILI_TEST_KEY: integration-master-key-123
