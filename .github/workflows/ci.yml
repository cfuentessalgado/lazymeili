name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories licenses sources

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [getmeili/meilisearch:v1.12.8, getmeili/meilisearch:latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker run -d --rm --name meili -p 7700:7700 -e MEILI_MASTER_KEY=integration-master-key-123 '${{ matrix.image }}'
      - run: for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7700/health && exit 0; sleep 1; done; exit 1
      - run: cargo test live_instance_workflow -- --ignored
        env:
          MEILI_TEST_URL: http://127.0.0.1:7700
          MEILI_TEST_KEY: integration-master-key-123
