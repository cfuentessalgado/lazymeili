[package]
name = "lazymeili"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for managing Meilisearch instances"
license = "MIT"
repository = "https://github.com/cfuentessalgado/lazymeili"
keywords = ["meilisearch", "tui", "terminal", "admin"]
categories = ["command-line-utilities"]

[dependencies]
age = "0.12"
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
keyring = "4"
meilisearch-sdk = { version = "0.33", default-features = false, features = ["reqwest", "tls", "jwt_aws_lc_rs"] }
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
insta = "1"
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
collapsible_if = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_fields_in_debug = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
semicolon_if_nothing_returned = "allow"
too_many_lines = "allow"
unnested_or_patterns = "allow"
